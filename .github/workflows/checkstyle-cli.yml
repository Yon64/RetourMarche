# Checkstyle CLI Action for Code Quality & Coding Standards
#
# Uses Checkstyle CLI directly (no Maven build lifecycle) to reduce
# dependency downloads and improve runtime.
#
# Config file: .github/checkstyle.xml
# Results are uploaded as a GitHub annotation and as a build artifact.

name: "Checkstyle CLI Code Quality Action"

on:
  push:
    branches: [ "main", "master", "bugfix/*" ]
    paths:
      - "**/*.java"
      - ".github/checkstyle.xml"
      - ".github/workflows/checkstyle-cli.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "**/*.java"
      - ".github/checkstyle.xml"
      - ".github/workflows/checkstyle-cli.yml"

concurrency:
  group: checkstyle-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle-cli:
    name: Checkstyle CLI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Checkstyle CLI
        run: |
          CHECKSTYLE_VERSION=10.17.0
          curl -sSL \
            -o checkstyle-all.jar \
            "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar"

      - name: Run Checkstyle CLI
        run: |
          mkdir -p target
          java -jar checkstyle-all.jar \
            -c .github/checkstyle.xml \
            -f xml \
            -o target/checkstyle-result.xml \
            src/main/java || true

      - name: Publish Checkstyle annotations in readable form
        if: always()
        uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
          path: target/checkstyle-result.xml
          name: Checkstyle CLI Violations
          title: Checkstyle CLI Report

      - name: Archive Checkstyle report to Github Action run storage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-cli-report
          path: target/checkstyle-result.xml
          retention-days: 30
