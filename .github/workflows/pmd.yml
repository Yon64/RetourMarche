# ────────────────────────────────────────────────────────────────────────────
# Workflow – Code Quality : PMD Static Analysis
#
# PMD analyses Java source code (not bytecode) to detect:
#   • Dead code (unused variables, parameters, imports)
#   • Empty blocks (catch, if, switch)
#   • Overly complex code (too many return statements, nesting, etc.)
#   • Best-practice violations (string comparison with ==, etc.)
#   • Some security issues (hardcoded IV, insecure random)
#
# Ruleset: quickstart.xml covers the most impactful rules without noise.
# Results are uploaded to GitHub Security tab as SARIF.
# ────────────────────────────────────────────────────────────────────────────

name: "Quality – PMD Code Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write  # upload SARIF to GitHub Security tab
  actions: read           # needed by codeql-action on private repos

jobs:
  pmd-code-scan:
    name: PMD Analysis
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. Set up Java 17 (matches project's java.version property) ──────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Run PMD on all Java sources under src/main/java ───────────────
      # analyzeModifiedFilesOnly=false: always scan everything, not just diffs.
      # rulesets/java/quickstart.xml is PMD's curated starter ruleset.
      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: 'category/java/errorprone.xml,category/java/bestpractices.xml'
          sourcePath: 'src/main/java'
          analyzeModifiedFilesOnly: false

      # ── 4. Upload SARIF report to GitHub Security tab ─────────────────────
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pmd-report.sarif
          category: pmd

      # ── 5. Keep report as a downloadable artifact ─────────────────────────
      - name: Archive PMD report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: pmd-report.sarif
          retention-days: 30
